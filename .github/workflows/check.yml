name: check

on:
  push:
  pull_request:

jobs:
  private-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Private-term guard
        run: bash always/scripts/check-private-terms.sh
      - name: Workflow-stub guard
        run: python3 always/scripts/check-workflow-stubs.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 always/scripts/test_check_wiring.py
      - run: python3 always/scripts/test_supervised_git_backstop.py
      - run: python3 always/scripts/test_grok_acp_exec.py
      - run: bash always/scripts/lib/test-codex-registry.sh
      - run: bash always/scripts/lib/test-wrappers.sh
      - run: python3 always/scripts/test_foreground_dispatch_guard.py
      - uses: oven-sh/setup-bun@v2
      - run: bun pi/tests/destructive-guard.test.ts
      - run: bun pi/tests/bash-timeout-guard.test.ts
